[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efs"
version = "0.1.0"
description = "Energy forecasting (DWT-TNN) and GA-based battery scheduling for smart buildings"
requires-python = ">=3.10"
# Exact dependency versions are pinned in requirements.txt (pip freeze).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
